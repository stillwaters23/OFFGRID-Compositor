name: Build debug app

on:
  push:
    branches:
      - ccr-c441a76e-hgt5wa
      - step-2-2-premium-panel
      - step-2-4-presets-layouts
      - final-build
      - copilot/lane-c-live-remote
      - copilot/lane-e-media-pipe-person-segmentation
  pull_request:
    branches:
      - final-build
      - main
      - final-build
      - ccr-c441a76e-hgt5wa
      - step-2-2-premium-panel
      - step-2-4-presets-layouts

permissions:
  contents: write

concurrency:
  group: offgrid-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the debug app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Check the new files for saved secrets
        run: |
          python3 - << 'PY'
          import os
          import re
          import sys
          pattern = re.compile(
              r"(?i)(api[_-]?key|secret|password|passwd|stream[_-]?key|access[_-]?token)\s*[:=]\s*['\"][^'\"]{6,}['\"]"
          )
          roots = ["04 Build", ".github"]
          bad = []
          for root in roots:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [name for name in dirnames if name not in (".gradle", "build")]
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      try:
                          text = open(path, encoding="utf-8", errors="ignore").read()
                      except OSError:
                          continue
                      if pattern.search(text):
                          bad.append(path)
          if bad:
              print("A saved secret was found in:")
              print("\n".join(bad))
              sys.exit(1)
          print("No saved secrets found.")
          PY

      - name: Check capture uses the processed mic path
        run: |
          set -euo pipefail
          if grep -R -n -E "\.withAudioEnabled|AudioSource\.(MIC|CAMCORDER)" "04 Build/app/src/main/java"; then
            echo "The video recorder must not capture raw microphone audio."
            exit 1
          fi

      - name: Check voice conversion stays on device
        run: |
          set -euo pipefail
          if grep -R -n -E "TextToSpeech|SpeechRecognizer|android\.speech" "04 Build"/*/src; then
            echo "Voice processing must stay on this phone. Cloud speech stays off."
            exit 1
          fi

      - name: Check there are no sliders
        run: |
          set -euo pipefail
          if grep -R -n -E "SeekBar|RangeSlider|material\.slider|<Slider|Slider\(" "04 Build"/*/src; then
            echo "Every number is typed. Sliders are not allowed."
            exit 1
          fi

      - name: Build the debug app
        working-directory: 04 Build
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Run Android lint
        working-directory: 04 Build
        run: ./gradlew lintDebug --stacktrace

      - name: Check the color mix math
        working-directory: 04 Build
        run: ./gradlew testDebugUnitTest --stacktrace

      # Royalty approved the mic and Send to PC. CAMERA, RECORD_AUDIO, and INTERNET
      # are allowed. The floating live controls also need the overlay, a notification,
      # and a foreground service typed for the camera and the mic. ACCESS_NETWORK_STATE
      # and Wi-Fi permissions stay banned. androidx.core adds one package permission;
      # that exact name is accepted. The person mask still has no server call.
      - name: Check the built app only asks for allowed permissions
        run: |
          set -euo pipefail
          merged="$(find "04 Build/app/build" -path "*merged_manifest*" -name AndroidManifest.xml | head -n 1)"
          test -n "$merged"
          python3 - "$merged" << 'PY'
          import sys
          import xml.etree.ElementTree as ET
          allowed = {
              "CAMERA",
              "RECORD_AUDIO",
              "INTERNET",
              "SYSTEM_ALERT_WINDOW",
              "POST_NOTIFICATIONS",
              "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_SPECIAL_USE",
              "FOREGROUND_SERVICE_CAMERA",
              "FOREGROUND_SERVICE_MICROPHONE",
          }
          banned = {
              "android.permission.ACCESS_NETWORK_STATE",
          }
          name = "{http://schemas.android.com/apk/res/android}name"
          root = ET.parse(sys.argv[1]).getroot()
          found = sorted(
              node.get(name)
              for tag in ("uses-permission", "uses-permission-sdk-23")
              for node in root.iter(tag)
          )
          print("Permissions in the built app:")
          for permission in found:
              print("  " + permission)
          if "android.permission.RECORD_AUDIO" not in found:
              print("RECORD_AUDIO is approved and must stay in the app.")
              sys.exit(1)
          print("RECORD_AUDIO is allowed.")
          if "android.permission.INTERNET" not in found:
              print("Send to PC and the direct phone link need INTERNET.")
              sys.exit(1)
          print("INTERNET is only for local Send to PC and the direct phone link.")
          exact = {"com.offgrid.compositor.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"}
          extra = [
              p for p in found
              if p in banned
              or (
                  p not in exact
                  and (p.rsplit(".", 1)[-1] not in allowed or not p.startswith("android.permission."))
              )
          ]
          if extra:
              print("These permissions are not allowed:")
              print("\n".join(extra))
              sys.exit(1)
          print("Every permission is on the allowed list.")
          PY
          if grep -R -n -E "https?://" "04 Build/app/src/main/java/com/offgrid/compositor/person_segmenter.kt"; then
            echo "Camera frames must stay on the phone."
            exit 1
          fi
          if ! grep -q "isSiteLocalAddress" "04 Build/live/src/main/java/com/offgrid/live/LocalNetwork.kt"; then
            echo "Public addresses must stay refused."
            exit 1
          fi
          echo "The person mask stays on the phone. Public addresses stay refused."

      - name: Name the app file
        run: |
          mkdir -p dist
          cp "04 Build/app/build/outputs/apk/debug/app-debug.apk" "dist/OFFGRID Preview.apk"
          test -s "dist/OFFGRID Preview.apk"

      - name: Upload the app file
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID Preview
          path: dist/OFFGRID Preview.apk
          if-no-files-found: error

      - name: Attach the app file to the preview release
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/final-build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.txt << 'EOF'
          This is the FINAL build test version of OFFGRID.
          It is not merged yet. Rex reviews it first.
          Camera permission is required. Microphone permission is used for videos when Mic is on.
          The mic starts off and can be hard-blocked. Rex voice swap stays on the phone.

          Sign in to GitHub in your phone browser first. This project is private.

          How to put it on your phone
          1. Remove the old OFFGRID first. Press and hold its icon. Tap Uninstall.
             This build is new, so the phone may refuse to update over the old one.
          2. Tap OFFGRID.Preview.apk below.
          3. If your phone asks, allow this browser to install apps.
          4. Tap Install. If Play Protect warns you, tap More details, then Install anyway.
          5. Open OFFGRID. Tap Allow so the front camera can turn on.
          6. The mic asks only when you turn the mic toggle on. Videos then carry your voice.

          What to check
          1. Toggles: every toggle is a circle with a power symbol. Lit means on, dim means off.
             Panel settings > 📁 Themes > 📁 Toggle style picks Pure White or Pure Black.
          2. Size 100: the panel fills the whole screen, edge to edge, with nothing cut off.
          3. Side list: with Swipe to open, swipe from the left edge. Tap a row's left edge. It opens.
          4. Camera denied: deny the camera once. The panel steps aside so Try again can be tapped.
          5. Move folders: in the ⋮ menu, turn it on. Long press a folder to move it.
             A swipe still scrolls. Undo last move puts it back.
          6. No-face modes: open 📁 Camera. The face diamond covers your face and follows it.
             Try each Camera mode: Blackout, Cloak void, Status label, Ghost.
          7. Effects: open 📁 Effects. Turn on Emoji rain. Tap Shatter now in 📁 Shatter.
             Tap − to shrink the panel to see your video.
          8. Record and play: tap Record, then Stop. Tap Play last video. The panel is not in it.
             The video is also in your gallery, in Movies > OFFGRID.
          9. Presets: Panel settings > 📁 Presets. Type a name, tap Done, then Save.
             Change a color, then tap Load. Your saved look comes back.

          The README in the project lists every feature and how to use it.
          EOF
          if gh release view step-2-preview >/dev/null 2>&1; then
            gh release delete step-2-preview --yes --cleanup-tag
          fi
          gh release create step-2-preview "dist/OFFGRID Preview.apk" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "step-2-preview" \
            --notes-file /tmp/release-notes.txt
