name: Build debug app

on:
  push:
    branches:
      - ccr-c441a76e-hgt5wa
      - step-2-2-premium-panel
  pull_request:
    branches:
      - main
      - ccr-c441a76e-hgt5wa

permissions:
  contents: write

concurrency:
  group: offgrid-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the debug app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Check the new files for saved secrets
        run: |
          python3 - << 'PY'
          import os
          import re
          import sys
          pattern = re.compile(
              r"(?i)(api[_-]?key|secret|password|passwd|stream[_-]?key|access[_-]?token)\s*[:=]\s*['\"][^'\"]{6,}['\"]"
          )
          roots = ["04 Build", ".github"]
          bad = []
          for root in roots:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [name for name in dirnames if name not in (".gradle", "build")]
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      try:
                          text = open(path, encoding="utf-8", errors="ignore").read()
                      except OSError:
                          continue
                      if pattern.search(text):
                          bad.append(path)
          if bad:
              print("A saved secret was found in:")
              print("\n".join(bad))
              sys.exit(1)
          print("No saved secrets found.")
          PY

      - name: Check the mic stays off
        run: |
          set -euo pipefail
          if grep -R -n -E "RECORD_AUDIO|withAudioEnabled" "04 Build/app/src/main/java"; then
            echo "This step must not use the mic."
            exit 1
          fi

      - name: Check voice stays paused
        run: |
          set -euo pipefail
          if grep -R -n -E "TextToSpeech|SpeechRecognizer|AudioRecord|android\.speech" "04 Build/app/src/main/java"; then
            echo "Voice is paused until Royalty says go."
            exit 1
          fi

      - name: Check there are no sliders
        run: |
          set -euo pipefail
          if grep -R -n -E "SeekBar|RangeSlider|material\.slider|<Slider|Slider\(" "04 Build/app/src"; then
            echo "Every number is typed. Sliders are not allowed."
            exit 1
          fi

      - name: Build the debug app
        working-directory: 04 Build
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Check the color mix math
        working-directory: 04 Build
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Check the built app has no mic permission
        run: |
          set -euo pipefail
          merged="$(find "04 Build/app/build" -path "*merged_manifest*" -name AndroidManifest.xml | head -n 1)"
          test -n "$merged"
          if grep -q "android.permission.RECORD_AUDIO" "$merged"; then
            echo "This step must not use the mic."
            exit 1
          fi
          echo "Mic permission is not in the app."

      - name: Name the app file
        run: |
          mkdir -p dist
          cp "04 Build/app/build/outputs/apk/debug/app-debug.apk" "dist/OFFGRID Preview.apk"
          test -s "dist/OFFGRID Preview.apk"

      - name: Upload the app file
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID Preview
          path: dist/OFFGRID Preview.apk
          if-no-files-found: error

      - name: Attach the app file to the preview release
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/ccr-c441a76e-hgt5wa' || github.ref == 'refs/heads/step-2-2-premium-panel')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.txt << 'EOF'
          This is the Step 2.2 test build of OFFGRID. Step 2.3 is in it too.
          The terminal panel is now premium: dark titanium, carbon fiber, and thick sapphire glass.
          Every panel setting now lives in a folder.
          The mic stays off.

          Sign in to GitHub in your phone browser first. This project is private.

          How to put it on your phone
          1. If OFFGRID is already on your phone, remove it first.
             Press and hold the OFFGRID icon. Tap Uninstall.
             Each test build is new, so the phone may refuse the update.
          2. Tap OFFGRID.Preview.apk below.
          3. If your phone asks, allow this browser to install apps.
          4. Tap Install. If Play Protect warns you, tap More details, then Install anyway.
          5. Open OFFGRID. Tap Allow so the front camera can turn on.

          What to look for first
          1. The panel opens in the exact middle of the screen.
          2. A dark titanium frame, a carbon fiber top bar, and deep sapphire glass inside.
          3. Titles and typed words are bright laser teal with a strong glow.
          4. The laser cursor is one solid white block. No soft glow around it.
          5. The corners are sharp. Corner roundness starts at 4.
          6. The toggles are the original red OFF and green ON pictures. The swirl inside them is gone.

          How to test the panel
          1. At the top, tap the WIDTH box. Type 30. Tap Done. The panel gets narrower.
             Type 150. Tap Done. The panel says the number is too big. Nothing changes.
          2. Tap the HEIGHT box. Type 60. Tap Done. The panel gets taller.
          3. Put two fingers on the panel and spread them sideways. The panel gets wider.
             Spread them up and down. It gets taller. Spread them on a slant. Both change.
             Watch the WIDTH and HEIGHT numbers change while you pinch.
          4. Drag the top bar. A soft cross shows the middle of the screen.
             Near the middle, the panel clicks into place.
          5. Tap Panel settings. Every setting is in a folder now.
          6. Tap 📁 Size. Width and Height here match the top boxes.
             Tap Center panel. The panel glides to the middle.
          7. Tap any number box. The edge of its row glows while you type.
             If touch vibration is on, your phone ticks when the number is saved.
          8. Touch the edge of the panel. Light ripples where your finger is.
          9. Tap BACK. Tap 📁 Themes. Tap Titanium Sapphire for the full teal look.
             Tap OLED Bioluminescent to go back.
          10. Tap BACK. Tap 📁 Colors, then 📁 Laser cursor color.
              In HEX CODE, type #00FF66. Tap Done. The cursor turns solid green.
              Type 40 in Cursor glow. A soft glow shows. Type 0 to turn it off.
          11. Tap BACK twice. Tap 📁 Display. Test diamond is red, so it is off.
          12. Tap BACK. Tap 📁 Reset. Tap Reset all to default. Tap Yes, reset all.
              The cursor is solid white again. The panel goes back to its start size.
          13. Swipe OFFGRID away from your recent apps. Open it again.
              Your size, place, and settings are kept.
          14. In your phone's Settings, search for Remove animations. Turn it on.
              The glow stops breathing and touching the edge makes no ripple. The cursor glow stays off.
              Turn Remove animations off again when you are done.

          How to check the video
          1. Tap Record 5 seconds.
          2. Tap Play last video.
          3. The panel is not in the video. That is on purpose.
          4. To see the diamond in a video, turn on Test diamond in 📁 Display first.
          EOF
          if gh release view step-2-preview >/dev/null 2>&1; then
            gh release delete step-2-preview --yes --cleanup-tag
          fi
          gh release create step-2-preview "dist/OFFGRID Preview.apk" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "step-2-preview" \
            --notes-file /tmp/release-notes.txt
