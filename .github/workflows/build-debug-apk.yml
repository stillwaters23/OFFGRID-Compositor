name: Build debug app

on:
  push:
    branches:
      - ccr-c441a76e-hgt5wa
      - step-2-2-premium-panel
      - step-2-4-presets-layouts
  pull_request:
    branches:
      - main
      - ccr-c441a76e-hgt5wa
      - step-2-2-premium-panel

permissions:
  contents: write

concurrency:
  group: offgrid-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the debug app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Check the new files for saved secrets
        run: |
          python3 - << 'PY'
          import os
          import re
          import sys
          pattern = re.compile(
              r"(?i)(api[_-]?key|secret|password|passwd|stream[_-]?key|access[_-]?token)\s*[:=]\s*['\"][^'\"]{6,}['\"]"
          )
          roots = ["04 Build", ".github"]
          bad = []
          for root in roots:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [name for name in dirnames if name not in (".gradle", "build")]
                  for name in filenames:
                      path = os.path.join(dirpath, name)
                      try:
                          text = open(path, encoding="utf-8", errors="ignore").read()
                      except OSError:
                          continue
                      if pattern.search(text):
                          bad.append(path)
          if bad:
              print("A saved secret was found in:")
              print("\n".join(bad))
              sys.exit(1)
          print("No saved secrets found.")
          PY

      - name: Check the mic stays off
        run: |
          set -euo pipefail
          if grep -R -n -E "RECORD_AUDIO|withAudioEnabled" "04 Build/app/src/main/java"; then
            echo "This step must not use the mic."
            exit 1
          fi

      - name: Check voice stays paused
        run: |
          set -euo pipefail
          if grep -R -n -E "TextToSpeech|SpeechRecognizer|AudioRecord|android\.speech" "04 Build/app/src/main/java"; then
            echo "Voice is paused until Royalty says go."
            exit 1
          fi

      - name: Check there are no sliders
        run: |
          set -euo pipefail
          if grep -R -n -E "SeekBar|RangeSlider|material\.slider|<Slider|Slider\(" "04 Build/app/src"; then
            echo "Every number is typed. Sliders are not allowed."
            exit 1
          fi

      - name: Build the debug app
        working-directory: 04 Build
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Check the color mix math
        working-directory: 04 Build
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Check the built app has no mic permission
        run: |
          set -euo pipefail
          merged="$(find "04 Build/app/build" -path "*merged_manifest*" -name AndroidManifest.xml | head -n 1)"
          test -n "$merged"
          if grep -q "android.permission.RECORD_AUDIO" "$merged"; then
            echo "This step must not use the mic."
            exit 1
          fi
          echo "Mic permission is not in the app."

      - name: Name the app file
        run: |
          mkdir -p dist
          cp "04 Build/app/build/outputs/apk/debug/app-debug.apk" "dist/OFFGRID Preview.apk"
          test -s "dist/OFFGRID Preview.apk"

      - name: Upload the app file
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID Preview
          path: dist/OFFGRID Preview.apk
          if-no-files-found: error

      - name: Attach the app file to the preview release
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/ccr-c441a76e-hgt5wa' ||
           github.ref == 'refs/heads/step-2-2-premium-panel' ||
           github.ref == 'refs/heads/step-2-4-presets-layouts')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.txt << 'EOF'
          This is the Step 2.4 test build of OFFGRID.
          The panel now starts plain and simple: true black, a solid white laser cursor, full screen.
          The ⋮ menu changes how folders look, like the three dots in Samsung My Files.
          The mic stays off.

          Sign in to GitHub in your phone browser first. This project is private.

          How to put it on your phone
          1. If OFFGRID is already on your phone, remove it first.
             Press and hold the OFFGRID icon. Tap Uninstall.
             Each test build is new, so the phone may refuse the update.
          2. Tap OFFGRID.Preview.apk below.
          3. If your phone asks, allow this browser to install apps.
          4. Tap Install. If Play Protect warns you, tap More details, then Install anyway.
          5. Open OFFGRID. Tap Allow so the front camera can turn on.

          What to look for first
          1. The panel fills the screen, like a terminal window. Width 100 and Height 100.
          2. True black glass, half see-through. No titanium frame. No sapphire glass.
          3. The laser cursor is one solid white block. It types slowly, at Typing speed 1.
          4. The glow is steady. It does not breathe. Pulse is off until you turn it on.
          5. The Record bar hides behind the full panel, so its words never show through.
             Tap − at the top right to shrink the panel. The Record bar comes back.

          How to test the panel
          1. Tap Panel settings. The folders are in this order:
             Size, Display, Glow effects, Colors, Themes, Reset.
          2. Tap 📁 Size. Type 0 in Width and 0 in Height. Tap Done.
             The panel is now the smallest size. Type 100 in both to fill the screen again.
          3. Type 100 in Font size. Every word stays whole. Nothing is cut off.
             Type 50 to go back.
          4. Tap BACK. Tap 📁 Glow effects. Type 100 in Glow strength.
             The glow gets big and bright. 50 is normal. 0 is no glow.
             The Glow toggle at the top turns all the glow off and on.
             Turn on Pulse to make the glow breathe. Pulse speed sets how fast.
          5. Tap BACK. Tap 📁 Colors, then 📁 Laser cursor color.
             There are nine colors now: Red, Orange, Yellow, Green, Blue, Indigo, Violet, White, Black.
             Type #FF8000 in HEX CODE. Tap Done. Orange shows 100.

          How to test the ⋮ menu
          1. Tap ⋮ at the top. Tap Big list, then Grid 2, then Grid 3, then List.
             The folders change at once. Tap outside the menu, or press Back, to close it.
          2. Tap ⋮. Tap A to Z. The folders sort by name.
          3. Turn on Move folders. Press a folder and drag it to a new spot.
             The other folders slide out of the way, and your phone ticks.
             Close the app and open it again. Your order is kept.
             Turn Move folders off when you are done.
          4. Type 100 in Folder size. The folders get bigger. 50 is normal.
          5. Tap Swipe to open. The side list tucks away.
             Swipe right from the glowing line in the middle of the left edge. The side list slides out.
             Swipe it left, tap outside it, or press Back to close it.
          6. Tap Hidden. The side list is gone. Tap Show to bring it back.
          7. Tap BACK until you are home. Tap Panel settings, then 📁 Reset.
             Tap Reset all to default. Tap Yes, reset all.
             Everything goes back to the start, the ⋮ menu choices too.

          How to check the video
          1. Tap − to shrink the panel.
          2. Tap Record 5 seconds.
          3. Tap Play last video.
          4. The panel is not in the video. That is on purpose.
          5. To see the diamond in a video, turn on Test diamond in 📁 Display first.
          EOF
          if gh release view step-2-preview >/dev/null 2>&1; then
            gh release delete step-2-preview --yes --cleanup-tag
          fi
          gh release create step-2-preview "dist/OFFGRID Preview.apk" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "step-2-preview" \
            --notes-file /tmp/release-notes.txt
